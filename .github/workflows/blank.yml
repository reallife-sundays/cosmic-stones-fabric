              { \"from\": [6.25, 5, 6.75], \"to\": [9.75, 11, 9.25], \"faces\": { \"north\": {\"uv\": [0, 0, 7, 12], \"texture\": \"#gem\"}, \"east\": {\"uv\": [7, 0, 12, 12], \"texture\": \"#gem\"}, \"south\": {\"uv\": [0, 0, 7, 12], \"texture\": \"#gem\"}, \"west\": {\"uv\": [7, 0, 12, 12], \"texture\": \"#gem\"}, \"up\": {\"uv\": [0, 0, 7, 5], \"texture\": \"#gem\"}, \"down\": {\"uv\": [0, 5, 7, 10], \"texture\": \"#gem\"} } },
              { \"from\": [6.75, 5.75, 6.25], \"to\": [9.25, 10.25, 9.75], \"faces\": { \"north\": {\"uv\": [2, 2, 7, 11], \"texture\": \"#gem\"}, \"east\": {\"uv\": [2, 2, 9, 11], \"texture\": \"#gem\"}, \"south\": {\"uv\": [2, 2, 7, 11], \"texture\": \"#gem\"}, \"west\": {\"uv\": [2, 2, 9, 11], \"texture\": \"#gem\"}, \"up\": {\"uv\": [2, 2, 7, 9], \"texture\": \"#gem\"}, \"down\": {\"uv\": [2, 2, 7, 9], \"texture\": \"#gem\"} } }
            ],
            \"display\": { \"gui\": {\"rotation\": [25, 215, 0], \"translation\": [0, 0, 0], \"scale\": [1.15, 1.15, 1.15]} }
          }
          '''
          }

          # Write all source and asset files safely
          for path, content in files.items():
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # Write dummy transparent PNGs for textures
          png_data = bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789c636000000002000148afa4710000000049454e44ae426082')
          tex_list = [
              'src/main/resources/assets/cosmicstones/textures/block/meteor_core.png',
              'src/main/resources/assets/cosmicstones/textures/block/meteor_core_glow.png',
              'src/main/resources/assets/cosmicstones/textures/item/siphon_obsidian.png',
              'src/main/resources/assets/cosmicstones/textures/item/siphon_gold.png',
              'src/main/resources/assets/cosmicstones/textures/item/power_stone.png',
              'src/main/resources/assets/cosmicstones/textures/item/space_stone.png',
              'src/main/resources/assets/cosmicstones/textures/item/time_stone.png',
              'src/main/resources/assets/cosmicstones/textures/item/reality_stone.png',
              'src/main/resources/assets/cosmicstones/textures/item/soul_stone.png',
              'src/main/resources/assets/cosmicstones/textures/item/mind_stone.png'
          ]
          for t in tex_list:
              parent = os.path.dirname(t)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(t, 'wb') as f:
                  f.write(png_data)
          "

      - name: Commit Generated Files to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-populate all Cosmic Stones Fabric 26.3 files" || echo "No changes"
          git push origin main || echo "Nothing to push"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Build Mod Jar
        run: gradle build --no-daemon

      - name: Upload Finished Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: cosmicstones-fabric-26.3
          path: build/libs/*[!sources].jar
