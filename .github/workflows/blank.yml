name: Generate & Build Fabric 26.3 Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate All Mod Files & Assets
        run: |
          python3 -c "
          import os

          files = {
              'build.gradle': '''plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
              id 'maven-publish'
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories { mavenCentral() }
          dependencies {
              minecraft 'com.mojang:minecraft:' + project.minecraft_version
              mappings 'net.fabricmc:yarn:' + project.yarn_mappings + ':v2'
              modImplementation 'net.fabricmc:fabric-loader:' + project.loader_version
              modImplementation 'net.fabricmc.fabric-api:fabric-api:' + project.fabric_version
          }
          processResources {
              inputs.property 'version', project.mod_version
              filesMatching('fabric.mod.json') { expand 'version': project.mod_version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java {
              toolchain { languageVersion = JavaLanguageVersion.of(25) }
              withSourcesJar()
          }
          ''',
              'gradle.properties': '''org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.3
          yarn_mappings=26.3+build.1
          loader_version=0.16.5
          fabric_version=0.104.0+26.3
          mod_version=1.0.0
          maven_group=com.cosmicstones
          archives_base_name=cosmicstones
          ''',
              'settings.gradle': '''pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          ''',
              'src/main/resources/fabric.mod.json': '''{
            \"schemaVersion\": 1,
            \"id\": \"cosmicstones\",
            \"version\": \"${version}\",
            \"name\": \"Cosmic Infinity Stones\",
            \"description\": \"Six primordial cosmic singularities for Fabric 26.3.\",
            \"authors\": [\"Oscar Moran\"],
            \"license\": \"MIT\",
            \"environment\": \"*\",
            \"entrypoints\": {
              \"main\": [ \"com.cosmicstones.CosmicStonesMod\" ],
              \"client\": [ \"com.cosmicstones.client.CosmicStonesClient\" ]
            },
            \"depends\": {
              \"fabricloader\": \">=0.16.0\",
              \"minecraft\": \"~26.3\",
              \"java\": \">=25\",
              \"fabric-api\": \"*\"
            }
          }
          ''',
              'src/main/java/com/cosmicstones/CosmicStonesMod.java': '''package com.cosmicstones;

          import com.cosmicstones.block.MeteorCoreBlock;
          import com.cosmicstones.event.MeteorSpawnHandler;
          import com.cosmicstones.event.PassiveHandler;
          import com.cosmicstones.item.CosmicSiphonItem;
          import com.cosmicstones.item.RawStoneItem;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.itemgroup.v1.FabricItemGroup;
          import net.fabricmc.fabric.api.object.builder.v1.block.FabricBlockSettings;
          import net.minecraft.block.Block;
          import net.minecraft.block.Blocks;
          import net.minecraft.item.BlockItem;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemGroup;
          import net.minecraft.item.ItemStack;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.Registry;
          import net.minecraft.registry.RegistryKey;
          import net.minecraft.registry.RegistryKeys;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.Rarity;

          public class CosmicStonesMod implements ModInitializer {
              public static final String MOD_ID = \"cosmicstones\";

              public static final Block METEOR_CORE = new MeteorCoreBlock(FabricBlockSettings.copyOf(Blocks.CRYING_OBSIDIAN).strength(20.0F, 1200.0F).luminance(14).requiresTool());
              public static final Item METEOR_CORE_ITEM = new BlockItem(METEOR_CORE, new Item.Settings().fireproof());

              public static final Item POWER_STONE = new RawStoneItem(\"power\");
              public static final Item SPACE_STONE = new RawStoneItem(\"space\");
              public static final Item TIME_STONE = new RawStoneItem(\"time\");
              public static final Item REALITY_STONE = new RawStoneItem(\"reality\");
              public static final Item SOUL_STONE = new RawStoneItem(\"soul\");
              public static final Item MIND_STONE = new RawStoneItem(\"mind\");

              public static final Item COSMIC_SIPHON = new CosmicSiphonItem(new Item.Settings().maxCount(1).fireproof().rarity(Rarity.RARE));
              public static final RegistryKey<ItemGroup> ITEM_GROUP = RegistryKey.of(RegistryKeys.ITEM_GROUP, new Identifier(MOD_ID, \"general\"));

              @Override
              public void onInitialize() {
                  Registry.register(Registries.BLOCK, new Identifier(MOD_ID, \"meteor_core\"), METEOR_CORE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"meteor_core\"), METEOR_CORE_ITEM);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"power_stone\"), POWER_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"space_stone\"), SPACE_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"time_stone\"), TIME_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"reality_stone\"), REALITY_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"soul_stone\"), SOUL_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"mind_stone\"), MIND_STONE);
                  Registry.register(Registries.ITEM, new Identifier(MOD_ID, \"cosmic_siphon\"), COSMIC_SIPHON);

                  Registry.register(Registries.ITEM_GROUP, ITEM_GROUP, FabricItemGroup.builder()
                          .icon(() -> new ItemStack(COSMIC_SIPHON))
                          .displayName(Text.translatable(\"itemGroup.cosmicstones\"))
                          .entries((ctx, entries) -> {
                              entries.add(METEOR_CORE_ITEM);
                              entries.add(COSMIC_SIPHON);
                              entries.add(POWER_STONE);
                              entries.add(SPACE_STONE);
                              entries.add(TIME_STONE);
                              entries.add(REALITY_STONE);
                              entries.add(SOUL_STONE);
                              entries.add(MIND_STONE);
                          }).build());

                  PassiveHandler.init();
                  MeteorSpawnHandler.init();
              }
          }
          ''',
              'src/main/java/com/cosmicstones/block/MeteorCoreBlock.java': '''package com.cosmicstones.block;

          import com.cosmicstones.CosmicStonesMod;
          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.entity.ItemEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.world.World;

          import java.util.HashMap;
          import java.util.Map;

          public class MeteorCoreBlock extends Block {
              private static final Map<BlockPos, Item> PENDING_DROPS = new HashMap<>();

              public MeteorCoreBlock(Settings settings) { super(settings); }

              public static void setStoneForLocation(BlockPos pos, Item stone) {
                  PENDING_DROPS.put(pos.toImmutable(), stone);
              }

              @Override
              public BlockState onBreak(World world, BlockPos pos, BlockState state, PlayerEntity player) {
                  if (!world.isClient && !player.isCreative()) {
                      ServerWorld serverWorld = (ServerWorld) world;
                      Item dropItem = PENDING_DROPS.remove(pos);
                      if (dropItem == null) dropItem = CosmicStonesMod.MIND_STONE;
                      ItemEntity drop = new ItemEntity(serverWorld, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, new ItemStack(dropItem));
                      drop.setGlowing(true);
                      drop.setNeverDespawn();
                      serverWorld.spawnEntity(drop);
                  }
                  return super.onBreak(world, pos, state, player);
              }
          }
          ''',
              'src/main/java/com/cosmicstones/item/RawStoneItem.java': '''package com.cosmicstones.item;

          import net.minecraft.entity.Entity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Rarity;
          import net.minecraft.world.World;

          public class RawStoneItem extends Item {
              private final String stoneType;

              public RawStoneItem(String stoneType) {
                  super(new Item.Settings().maxCount(1).fireproof().rarity(Rarity.EPIC));
                  this.stoneType = stoneType;
              }

              public String getStoneType() { return stoneType; }

              @Override
              public void inventoryTick(ItemStack stack, World world, Entity entity, int slot, boolean selected) {
                  if (!world.isClient && entity instanceof PlayerEntity player && !player.isCreative()) {
                      if ((selected || player.getOffHandStack() == stack) && world.getTime() % 40 == 0) {
                          player.damage(world.getDamageSources().magic(), 2.0F);
                          player.addExhaustion(3.0F);
                          if (world instanceof ServerWorld sw) {
                              sw.spawnParticles(ParticleTypes.LARGE_SMOKE, player.getX(), player.getY() + 1.0, player.getZ(), 8, 0.2, 0.3, 0.2, 0.02);
                          }
                          player.sendMessage(Text.literal(\"⚠ Raw Cosmic Radiation sears your hands! Socket into a Siphon.\").formatted(Formatting.RED), true);
                      }
                  }
              }
          }
          ''',
              'src/main/java/com/cosmicstones/item/CosmicSiphonItem.java': '''package com.cosmicstones.item;

          import com.cosmicstones.CosmicStonesMod;
          import net.minecraft.block.AnvilBlock;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.mob.CreeperEntity;
          import net.minecraft.entity.mob.MobEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.ItemUsageContext;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Hand;
          import net.minecraft.util.TypedActionResult;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.RaycastContext;
          import net.minecraft.world.World;

          public class CosmicSiphonItem extends Item {
              public CosmicSiphonItem(Settings settings) { super(settings); }

              public static String getSocketedStone(ItemStack stack) {
                  if (!stack.hasNbt()) return \"\";
                  NbtCompound tag = stack.getNbt();
                  return tag != null ? tag.getString(\"SocketedStone\") : \"\";
              }

              public static boolean isPassiveEnabled(ItemStack stack) {
                  if (!stack.hasNbt()) return true;
                  NbtCompound tag = stack.getNbt();
                  return tag == null || !tag.contains(\"PassiveEnabled\") || tag.getBoolean(\"PassiveEnabled\");
              }

              @Override
              public ActionResult useOnBlock(ItemUsageContext ctx) {
                  World world = ctx.getWorld();
                  BlockPos pos = ctx.getBlockPos();
                  PlayerEntity player = ctx.getPlayer();
                  ItemStack stack = ctx.getStack();

                  if (player != null && player.isSneaking() && world.getBlockState(pos).getBlock() instanceof AnvilBlock) {
                      String stone = getSocketedStone(stack);
                      if (!stone.isEmpty() && !world.isClient) {
                          Item item = switch (stone) {
                              case \"power\" -> CosmicStonesMod.POWER_STONE;
                              case \"space\" -> CosmicStonesMod.SPACE_STONE;
                              case \"time\" -> CosmicStonesMod.TIME_STONE;
                              case \"reality\" -> CosmicStonesMod.REALITY_STONE;
                              case \"soul\" -> CosmicStonesMod.SOUL_STONE;
                              default -> CosmicStonesMod.MIND_STONE;
                          };
                          stack.getOrCreateNbt().remove(\"SocketedStone\");
                          player.getInventory().offerOrDrop(new ItemStack(item));
                          world.playSound(null, pos, SoundEvents.BLOCK_ANVIL_USE, SoundCategory.PLAYERS, 1.0F, 1.0F);
                          player.sendMessage(Text.literal(\"Extracted \" + stone.toUpperCase() + \" Stone.\").formatted(Formatting.YELLOW), true);
                          return ActionResult.SUCCESS;
                      }
                  }
                  return super.useOnBlock(ctx);
              }

              @Override
              public TypedActionResult<ItemStack> use(World world, PlayerEntity player, Hand hand) {
                  ItemStack stack = player.getStackInHand(hand);
                  if (world.isClient) return TypedActionResult.success(stack);

                  NbtCompound tag = stack.getOrCreateNbt();
                  String stone = tag.getString(\"SocketedStone\");

                  ItemStack offhand = player.getOffHandStack();
                  if (player.isSneaking() && offhand.getItem() instanceof RawStoneItem raw) {
                      if (!stone.isEmpty()) {
                          player.sendMessage(Text.literal(\"Siphon occupied! Use an Anvil while sneaking to extract.\").formatted(Formatting.RED), true);
                          return TypedActionResult.fail(stack);
                      }
                      tag.putString(\"SocketedStone\", raw.getStoneType());
                      tag.putBoolean(\"PassiveEnabled\", true);
                      offhand.decrement(1);
                      world.playSound(null, player.getBlockPos(), SoundEvents.BLOCK_BEACON_ACTIVATE, SoundCategory.PLAYERS, 1.0F, 1.2F);
                      return TypedActionResult.success(stack);
                  }

                  if (stone.isEmpty()) return TypedActionResult.pass(stack);

                  int cd = executeMinor((ServerWorld) world, player, stone);
                  if (cd > 0) player.getItemCooldownManager().set(this, cd);
                  return TypedActionResult.success(stack);
              }

              private int executeMinor(ServerWorld world, PlayerEntity player, String stone) {
                  switch (stone) {
                      case \"power\" -> {
                          int stacks = player.getScoreboardTags().stream().filter(t -> t.startsWith(\"overcharge_\")).mapToInt(t -> Integer.parseInt(t.replace(\"overcharge_\", \"\"))).findFirst().orElse(0);
                          player.getScoreboardTags().removeIf(t -> t.startsWith(\"overcharge_\"));
                          float radius = stacks >= 8 ? 10.0F : (stacks >= 4 ? 7.0F : 4.0F);
                          float damage = stacks >= 8 ? 16.0F : (stacks >= 4 ? 10.0F : 6.0F);

                          for (LivingEntity target : world.getEntitiesByClass(LivingEntity.class, player.getBoundingBox().expand(radius), e -> e != player)) {
                              target.damage(world.getDamageSources().playerAttack(player), damage);
                              target.addVelocity(0, 0.55D + (stacks * 0.05D), 0);
                              target.velocityModified = true;
                          }
                          world.spawnParticles(ParticleTypes.EXPLOSION_EMITTER, player.getX(), player.getY(), player.getZ(), 1, 0, 0, 0, 0);
                          world.playSound(null, player.getBlockPos(), SoundEvents.ENTITY_GENERIC_EXPLODE, SoundCategory.PLAYERS, 1.5F, 0.7F);
                          return 900;
                      }
                      case \"space\" -> {
                          Vec3d start = player.getEyePos();
                          Vec3d look = player.getRotationVector().normalize();
                          Vec3d end = start.add(look.multiply(14.0D));
                          BlockHitResult hit = world.raycast(new RaycastContext(start, end, RaycastContext.ShapeType.COLLIDER, RaycastContext.FluidHandling.NONE, player));
                          BlockPos targetPos = hit.getBlockPos().offset(hit.getSide());
                          player.teleport(targetPos.getX() + 0.5, targetPos.getY(), targetPos.getZ() + 0.5);
                          player.onLanding();
                          world.playSound(null, targetPos, SoundEvents.ENTITY_ENDERMAN_TELEPORT, SoundCategory.PLAYERS, 1.0F, 1.0F);
                          return 800;
                      }
                      case \"mind\" -> {
                          for (MobEntity mob : world.getEntitiesByClass(MobEntity.class, player.getBoundingBox().expand(16.0D), e -> true)) {
                              mob.setTarget(null);
                              if (mob instanceof CreeperEntity c) c.setFuseSpeed(-1);
                          }
                          world.playSound(null, player.getBlockPos(), SoundEvents.BLOCK_BEACON_DEACTIVATE, SoundCategory.PLAYERS, 1.2F, 1.5F);
                          return 1200;
                      }
                  }
                  return 900;
              }
          }
          ''',
              'src/main/java/com/cosmicstones/event/PassiveHandler.java': '''package com.cosmicstones.event;

          import com.cosmicstones.item.CosmicSiphonItem;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.ItemStack;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.Hand;

          public class PassiveHandler {
              public static void init() {
                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      for (ServerPlayerEntity player : server.getPlayerManager().getPlayerList()) {
                          ItemStack siphon = findSiphon(player);
                          if (siphon.isEmpty() || !CosmicSiphonItem.isPassiveEnabled(siphon)) continue;
                          String stone = CosmicSiphonItem.getSocketedStone(siphon);
                          if (\"space\".equals(stone)) player.onLanding();
                      }
                  });

                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hitResult) -> {
                      if (!world.isClient && hand == Hand.MAIN_HAND && entity instanceof LivingEntity living) {
                          ItemStack siphon = findSiphon(player);
                          if (!siphon.isEmpty() && CosmicSiphonItem.isPassiveEnabled(siphon)) {
                              if (\"power\".equals(CosmicSiphonItem.getSocketedStone(siphon))) {
                                  int stacks = getStacks(player);
                                  if (stacks < 10) setStacks(player, stacks + 1);
                                  living.damage(world.getDamageSources().playerAttack(player), stacks * 1.5F);
                                  if (stacks == 10 && world instanceof ServerWorld sw) {
                                      sw.spawnParticles(ParticleTypes.EXPLOSION, living.getX(), living.getY() + 1, living.getZ(), 1, 0, 0, 0, 0);
                                  }
                              }
                          }
                      }
                      return ActionResult.PASS;
                  });
              }

              private static int getStacks(PlayerEntity player) {
                  return player.getScoreboardTags().stream().filter(t -> t.startsWith(\"overcharge_\")).mapToInt(t -> Integer.parseInt(t.replace(\"overcharge_\", \"\"))).findFirst().orElse(0);
              }

              private static void setStacks(PlayerEntity player, int val) {
                  player.getScoreboardTags().removeIf(t -> t.startsWith(\"overcharge_\"));
                  player.addScoreboardTag(\"overcharge_\" + val);
              }

              private static ItemStack findSiphon(PlayerEntity player) {
                  if (player.getMainHandStack().getItem() instanceof CosmicSiphonItem) return player.getMainHandStack();
                  if (player.getOffHandStack().getItem() instanceof CosmicSiphonItem) return player.getOffHandStack();
                  for (int i = 0; i < 9; i++) {
                      ItemStack s = player.getInventory().getStack(i);
                      if (s.getItem() instanceof CosmicSiphonItem) return s;
                  }
                  return ItemStack.EMPTY;
              }
          }
          ''',
              'src/main/java/com/cosmicstones/event/MeteorSpawnHandler.java': '''package com.cosmicstones.event;

          import com.cosmicstones.CosmicStonesMod;
          import com.cosmicstones.block.MeteorCoreBlock;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.block.Blocks;
          import net.minecraft.item.Item;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.world.Heightmap;
          import net.minecraft.world.World;

          import java.util.Random;

          public class MeteorSpawnHandler {
              private static final Random RANDOM = new Random();
              private static BlockPos pendingPos = null;
              private static int countdownTicks = 0;
              private static boolean autoEnabled = false;

              public static void init() {
                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) -> {
                      dispatcher.register(CommandManager.literal(\"cosmicmeteor\")
                              .requires(s -> s.hasPermissionLevel(2))
                              .then(CommandManager.literal(\"auto\")
                                      .then(CommandManager.literal(\"start\").executes(ctx -> {
                                          autoEnabled = true;
                                          ctx.getSource().sendFeedback(() -> Text.literal(\"✔ Meteor auto-spawn ENABLED.\").formatted(Formatting.GREEN), true);
                                          return 1;
                                      }))
                                      .then(CommandManager.literal(\"stop\").executes(ctx -> {
                                          autoEnabled = false;
                                          ctx.getSource().sendFeedback(() -> Text.literal(\"✖ Meteor auto-spawn DISABLED.\").formatted(Formatting.RED), true);
                                          return 1;
                                      }))
                              )
                      );
                  });

                  ServerTickEvents.END_WORLD_TICK.register(world -> {
                      if (world.getRegistryKey() != World.OVERWORLD) return;
                      if (pendingPos == null && autoEnabled && world.isNight() && world.getTime() % 24000 == 14000) {
                          if (!world.getPlayers().isEmpty() && RANDOM.nextFloat() < 0.20F) {
                              ServerPlayerEntity anchor = world.getPlayers().get(RANDOM.nextInt(world.getPlayers().size()));
                              int tx = anchor.getBlockX() + (RANDOM.nextBoolean() ? 1 : -1) * (50 + RANDOM.nextInt(60));
                              int tz = anchor.getBlockZ() + (RANDOM.nextBoolean() ? 1 : -1) * (50 + RANDOM.nextInt(60));
                              int ty = world.getTopY(Heightmap.Type.MOTION_BLOCKING_NO_LEAVES, tx, tz);

                              pendingPos = new BlockPos(tx, ty, tz);
                              countdownTicks = 9000;
                              broadcast(world, \"☄ Celestial anomaly breached orbit. Impact at [\" + tx + \", \" + ty + \", \" + tz + \"] in 7.5 minutes.\", Formatting.LIGHT_PURPLE);
                          }
                      }

                      if (pendingPos != null && countdownTicks > 0) {
                          countdownTicks--;
                          if (countdownTicks == 0) {
                              spawnImpact(world, pendingPos);
                              pendingPos = null;
                          }
                      }
                  });
              }

              private static void spawnImpact(ServerWorld world, BlockPos center) {
                  world.createExplosion(null, center.getX(), center.getY(), center.getZ(), 6.0F, World.ExplosionSourceType.BLOCK);
                  for (int x = -3; x <= 3; x++) {
                      for (int y = -2; y <= 1; y++) {
                          for (int z = -3; z <= 3; z++) {
                              if (x * x + y * y + z * z <= 6.5D) {
                                  world.setBlockState(center.add(x, y, z), RANDOM.nextBoolean() ? Blocks.OBSIDIAN.getDefaultState() : Blocks.CRYING_OBSIDIAN.getDefaultState());
                              }
                          }
                      }
                  }
                  world.setBlockState(center, CosmicStonesMod.METEOR_CORE.getDefaultState());
                  MeteorCoreBlock.setStoneForLocation(center, selectStone());
                  world.playSound(null, center, SoundEvents.ENTITY_GENERIC_EXPLODE, SoundCategory.BLOCKS, 5.0F, 0.7F);
              }

              private static Item selectStone() {
                  int r = RANDOM.nextInt(100);
                  if (r < 6) return CosmicStonesMod.POWER_STONE;
                  if (r < 16) return CosmicStonesMod.SOUL_STONE;
                  if (r < 34) return CosmicStonesMod.TIME_STONE;
                  if (r < 54) return CosmicStonesMod.SPACE_STONE;
                  if (r < 76) return CosmicStonesMod.REALITY_STONE;
                  return CosmicStonesMod.MIND_STONE;
              }

              private static void broadcast(ServerWorld world, String msg, Formatting color) {
                  for (ServerPlayerEntity p : world.getPlayers()) p.sendMessage(Text.literal(msg).formatted(color, Formatting.BOLD), false);
              }
          }
          ''',
              'src/main/java/com/cosmicstones/client/CosmicStonesClient.java': '''package com.cosmicstones.client;

          import com.cosmicstones.CosmicStonesMod;
          import com.cosmicstones.item.CosmicSiphonItem;
          import net.fabricmc.api.ClientModInitializer;
          import net.minecraft.client.item.ModelPredicateProviderRegistry;
          import net.minecraft.util.Identifier;

          public class CosmicStonesClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ModelPredicateProviderRegistry.register(
                          CosmicStonesMod.COSMIC_SIPHON,
                          new Identifier(CosmicStonesMod.MOD_ID, \"socketed_stone\"),
                          (stack, world, entity, seed) -> switch (CosmicSiphonItem.getSocketedStone(stack)) {
                              case \"power\" -> 0.1F;
                              case \"space\" -> 0.2F;
                              case \"time\" -> 0.3F;
                              case \"reality\" -> 0.4F;
                              case \"soul\" -> 0.5F;
                              case \"mind\" -> 0.6F;
                              default -> 0.0F;
                          }
                  );
              }
          }
          ''',
