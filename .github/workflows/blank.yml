name: Generate & Build Fabric 26.3 Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate All Mod Files & Assets
        run: |
          cat << 'EOF' > generate_workspace.py
          import os

          files = {
              'build.gradle': '''plugins {
              id 'net.fabricmc.fabric-loom' version '1.9.2'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven { url = 'https://maven.fabricmc.net/' }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 25
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(25)
              }
              withSourcesJar()
          }
          ''',

              'gradle.properties': '''org.gradle.jvmargs=-Xmx3G
          minecraft_version=26.3
          loader_version=0.20.1
          fabric_version=0.165.2+26.3
          mod_version=1.0.0
          maven_group=com.cosmicstones
          archives_base_name=cosmicstones
          ''',

              'settings.gradle': '''pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          ''',

              'src/main/resources/fabric.mod.json': '''{
            "schemaVersion": 1,
            "id": "cosmicstones",
            "version": "${version}",
            "name": "Cosmic Infinity Stones",
            "description": "Six primordial cosmic singularities for Fabric 26.3.",
            "authors": ["Oscar Moran"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [ "com.cosmicstones.CosmicStonesMod" ],
              "client": [ "com.cosmicstones.client.CosmicStonesClient" ]
            },
            "depends": {
              "fabricloader": ">=0.19.5",
              "minecraft": "~26.3",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          ''',

              'src/main/java/com/cosmicstones/CosmicStonesMod.java': '''package com.cosmicstones;

          import com.cosmicstones.block.MeteorCoreBlock;
          import com.cosmicstones.event.MeteorSpawnHandler;
          import com.cosmicstones.event.PassiveHandler;
          import com.cosmicstones.item.CosmicSiphonItem;
          import com.cosmicstones.item.RawStoneItem;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.itemgroup.v1.FabricItemGroup;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Rarity;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockBehaviour;

          import java.util.function.Function;

          public class CosmicStonesMod implements ModInitializer {
              public static final String MOD_ID = "cosmicstones";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              public static final Block METEOR_CORE = registerBlock("meteor_core",
                      MeteorCoreBlock::new,
                      BlockBehaviour.Properties.ofFullCopy(Blocks.CRYING_OBSIDIAN)
                              .strength(20.0F, 1200.0F)
                              .lightLevel(state -> 14)
                              .requiresCorrectToolForDrops());

              public static final Item METEOR_CORE_ITEM = registerItem("meteor_core",
                      props -> new BlockItem(METEOR_CORE, props),
                      new Item.Properties().useBlockDescriptionPrefix().fireResistant());

              public static final Item POWER_STONE = registerStone("power_stone", "power");
              public static final Item SPACE_STONE = registerStone("space_stone", "space");
              public static final Item TIME_STONE = registerStone("time_stone", "time");
              public static final Item REALITY_STONE = registerStone("reality_stone", "reality");
              public static final Item SOUL_STONE = registerStone("soul_stone", "soul");
              public static final Item MIND_STONE = registerStone("mind_stone", "mind");

              public static final Item COSMIC_SIPHON = registerItem("cosmic_siphon",
                      CosmicSiphonItem::new,
                      new Item.Properties().stacksTo(1).fireResistant().rarity(Rarity.RARE));

              public static final ResourceKey<CreativeModeTab> ITEM_GROUP = ResourceKey.create(Registries.CREATIVE_MODE_TAB, id("general"));

              private static Block registerBlock(String name, Function<BlockBehaviour.Properties, Block> factory, BlockBehaviour.Properties props) {
                  ResourceKey<Block> key = ResourceKey.create(Registries.BLOCK, id(name));
                  Block block = factory.apply(props.setId(key));
                  return Registry.register(BuiltInRegistries.BLOCK, key, block);
              }

              private static Item registerItem(String name, Function<Item.Properties, Item> factory, Item.Properties props) {
                  ResourceKey<Item> key = ResourceKey.create(Registries.ITEM, id(name));
                  Item item = factory.apply(props.setId(key));
                  return Registry.register(BuiltInRegistries.ITEM, key, item);
              }

              private static Item registerStone(String name, String type) {
                  return registerItem(name,
                          props -> new RawStoneItem(type, props),
                          new Item.Properties().stacksTo(1).fireResistant().rarity(Rarity.EPIC));
              }

              @Override
              public void onInitialize() {
                  Registry.register(BuiltInRegistries.CREATIVE_MODE_TAB, ITEM_GROUP, FabricItemGroup.builder()
                          .icon(() -> new ItemStack(COSMIC_SIPHON))
                          .title(Component.translatable("itemGroup.cosmicstones"))
                          .displayItems((ctx, entries) -> {
                              entries.accept(METEOR_CORE_ITEM);
                              entries.accept(COSMIC_SIPHON);
                              entries.accept(POWER_STONE);
                              entries.accept(SPACE_STONE);
                              entries.accept(TIME_STONE);
                              entries.accept(REALITY_STONE);
                              entries.accept(SOUL_STONE);
                              entries.accept(MIND_STONE);
                          }).build());

                  PassiveHandler.init();
                  MeteorSpawnHandler.init();
              }
          }
          ''',

              'src/main/java/com/cosmicstones/block/MeteorCoreBlock.java': '''package com.cosmicstones.block;

          import com.cosmicstones.CosmicStonesMod;
          import net.minecraft.core.BlockPos;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.entity.item.ItemEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;

          import java.util.HashMap;
          import java.util.Map;

          public class MeteorCoreBlock extends Block {
              private static final Map<BlockPos, Item> PENDING_DROPS = new HashMap<>();

              public MeteorCoreBlock(Properties properties) {
                  super(properties);
              }

              public static void setStoneForLocation(BlockPos pos, Item stone) {
                  PENDING_DROPS.put(pos.immutable(), stone);
              }

              @Override
              public BlockState playerWillDestroy(Level level, BlockPos pos, BlockState state, Player player) {
                  if (!level.isClientSide() && !player.isCreative() && level instanceof ServerLevel serverLevel) {
                      Item dropItem = PENDING_DROPS.remove(pos);
                      if (dropItem == null) dropItem = CosmicStonesMod.MIND_STONE;
                      ItemEntity drop = new ItemEntity(serverLevel, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, new ItemStack(dropItem));
                      drop.setGlowingTag(true);
                      drop.setUnlimitedLifetime();
                      serverLevel.addFreshEntity(drop);
                  }
                  return super.playerWillDestroy(level, pos, state, player);
              }
          }
          ''',

              'src/main/java/com/cosmicstones/item/RawStoneItem.java': '''package com.cosmicstones.item;

          import net.minecraft.ChatFormatting;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;

          public class RawStoneItem extends Item {
              private final String stoneType;

              public RawStoneItem(String stoneType, Properties properties) {
                  super(properties);
                  this.stoneType = stoneType;
              }

              public String getStoneType() {
                  return stoneType;
              }

              @Override
              public void inventoryTick(ItemStack stack, ServerLevel level, Entity entity, EquipmentSlot slot) {
                  if (entity instanceof Player player && !player.isCreative()) {
                      boolean inHands = player.getMainHandItem() == stack || player.getOffhandItem() == stack;
                      if (inHands && level.getGameTime() % 40 == 0) {
                          player.hurtServer(level, level.damageSources().magic(), 2.0F);
                          player.causeFoodExhaustion(3.0F);
                          level.sendParticles(ParticleTypes.LARGE_SMOKE, player.getX(), player.getY() + 1.0, player.getZ(), 8, 0.2, 0.3, 0.2, 0.02);
                          player.displayClientMessage(Component.literal("⚠ Raw Cosmic Radiation sears your hands! Socket into a Siphon.").withStyle(ChatFormatting.RED), true);
                      }
                  }
              }
          }
          ''',

              'src/main/java/com/cosmicstones/item/CosmicSiphonItem.java': '''package com.cosmicstones.item;

          import com.cosmicstones.CosmicStonesMod;
          import net.minecraft.ChatFormatting;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.monster.Creeper;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.component.CustomData;
          import net.minecraft.world.item.component.CustomModelData;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.Vec3;

          import java.util.List;

          public class CosmicSiphonItem extends Item {
              public CosmicSiphonItem(Properties properties) {
                  super(properties);
              }

              public static String getSocketedStone(ItemStack stack) {
                  CustomData comp = stack.get(DataComponents.CUSTOM_DATA);
                  if (comp == null) return "";
                  return comp.copyTag().getStringOr("SocketedStone", "");
              }

              public static boolean isPassiveEnabled(ItemStack stack) {
                  CustomData comp = stack.get(DataComponents.CUSTOM_DATA);
                  if (comp == null) return true;
                  CompoundTag tag = comp.copyTag();
                  return !tag.contains("PassiveEnabled") || tag.getBooleanOr("PassiveEnabled", true);
              }

              private static void syncModelData(ItemStack stack, String stone) {
                  float cmd = switch (stone) {
                      case "power" -> 1.0F;
                      case "space" -> 2.0F;
                      case "time" -> 3.0F;
                      case "reality" -> 4.0F;
                      case "soul" -> 5.0F;
                      case "mind" -> 6.0F;
                      default -> 0.0F;
                  };
                  stack.set(DataComponents.CUSTOM_MODEL_DATA, new CustomModelData(List.of(cmd), List.of(), List.of(), List.of()));
              }

              @Override
              public InteractionResult useOn(UseOnContext ctx) {
                  Level level = ctx.getLevel();
                  BlockPos pos = ctx.getClickedPos();
                  Player player = ctx.getPlayer();
                  ItemStack stack = ctx.getItemInHand();

                  if (player != null && player.isShiftKeyDown() && level.getBlockState(pos).is(BlockTags.ANVIL)) {
                      String stone = getSocketedStone(stack);
                      if (!stone.isEmpty() && !level.isClientSide()) {
                          Item item = switch (stone) {
                              case "power" -> CosmicStonesMod.POWER_STONE;
                              case "space" -> CosmicStonesMod.SPACE_STONE;
                              case "time" -> CosmicStonesMod.TIME_STONE;
                              case "reality" -> CosmicStonesMod.REALITY_STONE;
                              case "soul" -> CosmicStonesMod.SOUL_STONE;
                              default -> CosmicStonesMod.MIND_STONE;
                          };

                          CompoundTag tag = stack.getOrDefault(DataComponents.CUSTOM_DATA, CustomData.EMPTY).copyTag();
                          tag.remove("SocketedStone");
                          stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));
                          syncModelData(stack, "");

                          ItemStack stoneStack = new ItemStack(item);
                          if (!player.getInventory().add(stoneStack)) {
                              player.drop(stoneStack, false);
                          }
                          
                          level.playSound(null, pos, SoundEvents.ANVIL_USE, SoundSource.PLAYERS, 1.0F, 1.0F);
                          player.displayClientMessage(Component.literal("Extracted " + stone.toUpperCase() + " Stone.").withStyle(ChatFormatting.YELLOW), true);
                          return InteractionResult.SUCCESS;
                      }
                  }
                  return super.useOn(ctx);
              }

              @Override
              public InteractionResult use(Level level, Player player, InteractionHand hand) {
                  ItemStack stack = player.getItemInHand(hand);
                  if (level.isClientSide()) return InteractionResult.SUCCESS;

                  CompoundTag tag = stack.getOrDefault(DataComponents.CUSTOM_DATA, CustomData.EMPTY).copyTag();
                  String stone = tag.getStringOr("SocketedStone", "");

                  ItemStack offhand = player.getOffhandItem();
                  if (player.isShiftKeyDown() && offhand.getItem() instanceof RawStoneItem raw) {
                      if (!stone.isEmpty()) {
                          player.displayClientMessage(Component.literal("Siphon occupied! Use an Anvil while sneaking to extract.").withStyle(ChatFormatting.RED), true);
                          return InteractionResult.FAIL;
                      }
                      tag.putString("SocketedStone", raw.getStoneType());
                      tag.putBoolean("PassiveEnabled", true);
                      stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));
                      syncModelData(stack, raw.getStoneType());

                      offhand.shrink(1);
                      level.playSound(null, player.blockPosition(), SoundEvents.BEACON_ACTIVATE, SoundSource.PLAYERS, 1.0F, 1.2F);
                      return InteractionResult.SUCCESS;
                  }

                  if (stone.isEmpty()) return InteractionResult.PASS;

                  int cd = executeMinor((ServerLevel) level, player, stone);
                  if (cd > 0) player.getCooldowns().addCooldown(stack, cd);
                  return InteractionResult.SUCCESS;
              }

              private int executeMinor(ServerLevel level, Player player, String stone) {
                  switch (stone) {
                      case "power" -> {
                          int stacks = player.getTags().stream()
                                  .filter(t -> t.startsWith("overcharge_"))
                                  .mapToInt(t -> Integer.parseInt(t.replace("overcharge_", "")))
                                  .findFirst().orElse(0);
                          player.getTags().removeIf(t -> t.startsWith("overcharge_"));

                          float radius = stacks >= 8 ? 10.0F : (stacks >= 4 ? 7.0F : 4.0F);
                          float damage = stacks >= 8 ? 16.0F : (stacks >= 4 ? 10.0F : 6.0F);

                          for (LivingEntity target : level.getEntitiesOfClass(LivingEntity.class, player.getBoundingBox().inflate(radius), e -> e != player)) {
                              target.hurtServer(level, level.damageSources().playerAttack(player), damage);
                              target.push(0, 0.55D + (stacks * 0.05D), 0);
                              target.markHurt();
                          }
                          level.sendParticles(ParticleTypes.EXPLOSION_EMITTER, player.getX(), player.getY(), player.getZ(), 1, 0, 0, 0, 0);
                          level.playSound(null, player.blockPosition(), SoundEvents.GENERIC_EXPLODE.value(), SoundSource.PLAYERS, 1.5F, 0.7F);
                          return 900;
                      }
                      case "space" -> {
                          Vec3 start = player.getEyePosition();
                          Vec3 look = player.getLookAngle().normalize();
                          Vec3 end = start.add(look.scale(14.0D));
                          BlockHitResult hit = level.clip(new ClipContext(start, end, ClipContext.Block.COLLIDER, ClipContext.Fluid.NONE, player));
                          BlockPos targetPos = hit.getBlockPos().relative(hit.getDirection());
                          player.teleportTo(targetPos.getX() + 0.5, targetPos.getY(), targetPos.getZ() + 0.5);
                          player.resetFallDistance();
                          level.playSound(null, targetPos, SoundEvents.ENDERMAN_TELEPORT, SoundSource.PLAYERS, 1.0F, 1.0F);
                          return 800;
                      }
                      case "mind" -> {
                          for (Mob mob : level.getEntitiesOfClass(Mob.class, player.getBoundingBox().inflate(16.0D), e -> true)) {
                              mob.setTarget(null);
                              if (mob instanceof Creeper c) c.setSwellDir(-1);
                          }
                          level.playSound(null, player.blockPosition(), SoundEvents.BEACON_DEACTIVATE, SoundSource.PLAYERS, 1.2F, 1.5F);
                          return 1200;
                      }
                  }
                  return 900;
              }
          }
          ''',

              'src/main/java/com/cosmicstones/event/PassiveHandler.java': '''package com.cosmicstones.event;

          import com.cosmicstones.item.CosmicSiphonItem;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;

          public class PassiveHandler {
              public static void init() {
                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      for (ServerPlayer player : server.getPlayerList().getPlayers()) {
                          ItemStack siphon = findSiphon(player);
                          if (siphon.isEmpty() || !CosmicSiphonItem.isPassiveEnabled(siphon)) continue;
                          String stone = CosmicSiphonItem.getSocketedStone(siphon);
                          if ("space".equals(stone)) player.resetFallDistance();
                      }
                  });

                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hitResult) -> {
                      if (!world.isClientSide() && hand == InteractionHand.MAIN_HAND && entity instanceof LivingEntity living && world instanceof ServerLevel sw) {
                          ItemStack siphon = findSiphon(player);
                          if (!siphon.isEmpty() && CosmicSiphonItem.isPassiveEnabled(siphon)) {
                              if ("power".equals(CosmicSiphonItem.getSocketedStone(siphon))) {
                                  int stacks = getStacks(player);
                                  if (stacks < 10) setStacks(player, stacks + 1);
                                  living.hurtServer(sw, sw.damageSources().playerAttack(player), stacks * 1.5F);
                                  if (stacks == 10) {
                                      sw.sendParticles(ParticleTypes.EXPLOSION, living.getX(), living.getY() + 1, living.getZ(), 1, 0, 0, 0, 0);
                                  }
                              }
                          }
                      }
                      return InteractionResult.PASS;
                  });
              }

              private static int getStacks(Player player) {
                  return player.getTags().stream()
                          .filter(t -> t.startsWith("overcharge_"))
                          .mapToInt(t -> Integer.parseInt(t.replace("overcharge_", "")))
                          .findFirst().orElse(0);
              }

              private static void setStacks(Player player, int val) {
                  player.getTags().removeIf(t -> t.startsWith("overcharge_"));
                  player.addTag("overcharge_" + val);
              }

              private static ItemStack findSiphon(Player player) {
                  if (player.getMainHandItem().getItem() instanceof CosmicSiphonItem) return player.getMainHandItem();
                  if (player.getOffhandItem().getItem() instanceof CosmicSiphonItem) return player.getOffhandItem();
                  for (int i = 0; i < 9; i++) {
                      ItemStack s = player.getInventory().getItem(i);
                      if (s.getItem() instanceof CosmicSiphonItem) return s;
                  }
                  return ItemStack.EMPTY;
              }
          }
          ''',

              'src/main/java/com/cosmicstones/event/MeteorSpawnHandler.java': '''package com.cosmicstones.event;

          import com.cosmicstones.CosmicStonesMod;
          import com.cosmicstones.block.MeteorCoreBlock;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.ChatFormatting;
          import net.minecraft.commands.Commands;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.levelgen.Heightmap;

          import java.util.Random;

          public class MeteorSpawnHandler {
              private static final Random RANDOM = new Random();
              private static BlockPos pendingPos = null;
              private static int countdownTicks = 0;
              private static boolean autoEnabled = false;

              public static void init() {
                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) -> {
                      dispatcher.register(Commands.literal("cosmicmeteor")
                              .requires(s -> s.hasPermission(2))
                              .then(Commands.literal("auto")
                                      .then(Commands.literal("start").executes(ctx -> {
                                          autoEnabled = true;
                                          ctx.getSource().sendSuccess(() -> Component.literal("✔ Meteor auto-spawn ENABLED.").withStyle(ChatFormatting.GREEN), true);
                                          return 1;
                                      }))
                                      .then(Commands.literal("stop").executes(ctx -> {
                                          autoEnabled = false;
                                          ctx.getSource().sendSuccess(() -> Component.literal("✖ Meteor auto-spawn DISABLED.").withStyle(ChatFormatting.RED), true);
                                          return 1;
                                      }))
                              )
                      );
                  });

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      ServerLevel world = server.getLevel(Level.OVERWORLD);
                      if (world == null) return;
                      
                      if (pendingPos == null && autoEnabled && world.isNight() && world.getDayTime() % 24000 == 14000) {
                          if (!world.players().isEmpty() && RANDOM.nextFloat() < 0.20F) {
                              ServerPlayer anchor = world.players().get(RANDOM.nextInt(world.players().size()));
                              int tx = anchor.getBlockX() + (RANDOM.nextBoolean() ? 1 : -1) * (50 + RANDOM.nextInt(60));
                              int tz = anchor.getBlockZ() + (RANDOM.nextBoolean() ? 1 : -1) * (50 + RANDOM.nextInt(60));
                              int ty = world.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, tx, tz);

                              pendingPos = new BlockPos(tx, ty, tz);
                              countdownTicks = 9000;
                              broadcast(world, "☄ Celestial anomaly breached orbit. Impact at [" + tx + ", " + ty + ", " + tz + "] in 7.5 minutes.", ChatFormatting.LIGHT_PURPLE);
                          }
                      }

                      if (pendingPos != null && countdownTicks > 0) {
                          countdownTicks--;
                          if (countdownTicks == 0) {
                              spawnImpact(world, pendingPos);
                              pendingPos = null;
                          }
                      }
                  });
              }

              private static void spawnImpact(ServerLevel world, BlockPos center) {
                  world.explode(null, center.getX(), center.getY(), center.getZ(), 6.0F, Level.ExplosionInteraction.BLOCK);
                  for (int x = -3; x <= 3; x++) {
                      for (int y = -2; y <= 1; y++) {
                          for (int z = -3; z <= 3; z++) {
                              if (x * x + y * y + z * z <= 6.5D) {
                                  world.setBlockAndUpdate(center.offset(x, y, z), RANDOM.nextBoolean() ? Blocks.OBSIDIAN.defaultBlockState() : Blocks.CRYING_OBSIDIAN.defaultBlockState());
                              }
                          }
                      }
                  }
                  world.setBlockAndUpdate(center, CosmicStonesMod.METEOR_CORE.defaultBlockState());
                  MeteorCoreBlock.setStoneForLocation(center, selectStone());
                  world.playSound(null, center, SoundEvents.GENERIC_EXPLODE.value(), SoundSource.BLOCKS, 5.0F, 0.7F);
              }

              private static Item selectStone() {
                  int r = RANDOM.nextInt(100);
                  if (r < 6) return CosmicStonesMod.POWER_STONE;
                  if (r < 16) return CosmicStonesMod.SOUL_STONE;
                  if (r < 34) return CosmicStonesMod.TIME_STONE;
                  if (r < 54) return CosmicStonesMod.SPACE_STONE;
                  if (r < 76) return CosmicStonesMod.REALITY_STONE;
                  return CosmicStonesMod.MIND_STONE;
              }

              private static void broadcast(ServerLevel world, String msg, ChatFormatting color) {
                  Component text = Component.literal(msg).withStyle(color, ChatFormatting.BOLD);
                  for (ServerPlayer p : world.players()) p.displayClientMessage(text, false);
              }
          }
          ''',

